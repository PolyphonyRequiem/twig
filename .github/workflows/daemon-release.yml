name: Daemon package
on:
  push:
    tags: ['daemon-v*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daemon-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Standalone daemon package (no canvas or installation)
        shell: pwsh
        run: ./eng/daemon-package.ps1 -Output "$PWD\artifacts\daemon-win-x64" -PythonExecutable python
      - name: Build separate CLI candidate (no signing or installation)
        shell: pwsh
        run: |
          python eng/run-bounded.py --warn-after 120 --timeout 300 -- dotnet publish src/Twig/Twig.csproj -c Release -r win-x64 --self-contained true "-m:1" --verbosity minimal -o artifacts/cli-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'CLI candidate publish failed.' }
          Compress-Archive -Path artifacts\cli-win-x64\* -DestinationPath artifacts\twig-win-x64.zip
          $hash = (Get-FileHash artifacts\twig-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  twig-win-x64.zip" | Set-Content -Encoding ascii artifacts\twig-win-x64.zip.sha256
      - name: Verify extracted independent packages (isolated commands and synthetic certificate boundary only)
        shell: powershell
        run: python eng/run-bounded.py --warn-after 60 --timeout 300 -- powershell.exe -NoProfile -File eng/test-daemon-package.ps1 -Archive artifacts/twig-daemon-win-x64.zip -CliArchive artifacts/twig-win-x64.zip -PythonExecutable python
      - uses: actions/upload-artifact@v4
        with:
          name: twig-daemon-win-x64
          path: |
            artifacts/twig-daemon-win-x64.zip
            artifacts/twig-daemon-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: twig-cli-candidate-win-x64
          path: |
            artifacts/twig-win-x64.zip
            artifacts/twig-win-x64.zip.sha256
          if-no-files-found: error
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash eng/daemon-package-linux.sh
      - name: Build separate CLI candidate
        run: |
          python3 eng/run-bounded.py --warn-after 120 --timeout 300 -- dotnet publish src/Twig/Twig.csproj -c Release -r linux-x64 --self-contained true -m:1 --verbosity minimal -o artifacts/cli-linux-x64
          tar -czf artifacts/twig-linux-x64.tar.gz -C artifacts/cli-linux-x64 .
          (cd artifacts && sha256sum twig-linux-x64.tar.gz > twig-linux-x64.tar.gz.sha256)
      - name: Verify extracted independent packages (isolated headless host only)
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf -- "$fixture"' EXIT
          (cd artifacts && sha256sum -c twig-linux-x64.tar.gz.sha256 && sha256sum -c twig-daemon-linux-x64.tar.gz.sha256)
          mkdir "$fixture/cli"
          tar -xzf artifacts/twig-linux-x64.tar.gz -C "$fixture/cli"
          tar -xzf artifacts/twig-daemon-linux-x64.tar.gz -C "$fixture"
          python3 eng/run-bounded.py --warn-after 60 --timeout 300 -- python3 eng/test-daemon-commands.py --cli-dir "$fixture/cli" --daemon-dir "$fixture/daemon-linux-x64"
          TWIG_TEST_CLI="$fixture/cli/twig" python3 eng/run-bounded.py --warn-after 60 --timeout 300 -- bash eng/test-daemon-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: twig-daemon-linux-x64
          path: |
            artifacts/twig-daemon-linux-x64.tar.gz
            artifacts/twig-daemon-linux-x64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: twig-cli-candidate-linux-x64
          path: |
            artifacts/twig-linux-x64.tar.gz
            artifacts/twig-linux-x64.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/daemon-v')
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twig-daemon-*
          path: package
          merge-multiple: true
      - name: Publish independently versioned daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --latest=false --title "Twig daemon ${{ github.ref_name }}" --generate-notes package/*
