name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.rid }})
    # AB#140 — CI used to be a single `runs-on: ubuntu-latest` job while the
    # release workflow publishes win-x64, linux-x64 and osx-arm64. Anything
    # platform-conditional was therefore untested until tag day, and the first
    # execution on Windows happened DURING a release.
    #
    # That is not hypothetical: v0.85.0 failed two of four platform legs. One was
    # ours — three tests hardcoded a Unix shell path and were merged with a green
    # CI check, because the only multi-platform run lived in the release workflow.
    #
    # The sibling half of that incident (NuGet publishing before the platform
    # builds had proven they could compile, burning a version string
    # irreversibly) was already fixed in #362: the `nuget` job now `needs: build`.
    # This is the other half — test the platforms we actually ship, on every PR.
    #
    # macOS was deliberately omitted at AB#140, with an explicit re-entry condition:
    # "Add osx-arm64 here if a macOS-specific defect ever escapes." One has. The
    # v0.92.0 release run's macOS ARM64 leg failed 38 CLI skill tests (AB#886) —
    # Path.GetTempPath() is /var/folders/... on macOS and /var is a symlink, which
    # the skill link guard correctly refuses. The defect was macOS-only, was invisible
    # to this workflow, and was therefore first executed DURING a release: precisely
    # the failure mode the comment above says this matrix exists to abolish.
    #
    # The cost/risk trade that justified omitting macOS was made when no macOS-specific
    # defect had escaped. That premise is now falsified, so the condition it named is met.
    strategy:
      # fail-fast: false so one platform's failure does not cancel the other's
      # run. The point of this matrix is learning about every platform from a
      # single push rather than discovering them one at a time across re-pushes
      # — the same reasoning the release workflow's build matrix already carries.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Bounded-wrapper cleanup selftest (synthetic processes only)
        run: python tools/run-bounded.py --selftest
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canvas proposal Apply composition regression
        run: python tools/run-bounded.py --timeout 60 -- node --test .github/extensions/twig-item-companion/tests/native-apply.test.mjs .github/extensions/twig-item-companion/tests/proposal-canvas.test.mjs .github/extensions/twig-item-companion/tests/native-editing.test.mjs .github/extensions/twig-item-companion/tests/native-executable.test.mjs .github/extensions/twig-item-companion/tests/native-executable-source.test.mjs

      - name: Native captured-draft consumption regression
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~NativeConsumption|FullyQualifiedName~Apply_DraftCapturedJournal_RefusesBeforeConfirmation" --logger "trx;LogFileName=native-save.trx" --results-directory artifacts/test-logs/ci/native-save

      - name: Explicit workbench Save gesture and native transport regression
        run: python tools/run-bounded.py --timeout 60 -- node --test .github/extensions/twig-item-companion/tests/editing-client.test.mjs .github/extensions/twig-item-companion/tests/editing-bridge.test.mjs .github/extensions/twig-item-companion/tests/native-editing.test.mjs

      - name: Explicit Save command production composition regression
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~DraftSaveCommandTests" --logger "trx;LogFileName=explicit-save.trx" --results-directory artifacts/test-logs/ci/explicit-save

      - name: Verify explicit Save execution
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("artifacts/test-logs/ci/explicit-save/explicit-save.trx").getroot()
          results = root.findall(".//t:UnitTestResult", ns)
          counters = root.find(".//t:Counters", ns)
          assert counters is not None
          assert len(results) == len({r.attrib["testId"] for r in results}) == 8
          assert all(r.attrib["outcome"] == "Passed" for r in results)
          assert all(counters.attrib[key] == "8" for key in ("total", "executed", "passed"))
          assert all(counters.attrib[key] == "0" for key in ("failed", "error", "timeout", "aborted", "notExecuted"))
          assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"

      - name: Preserve explicit Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-explicit-save-${{ matrix.rid }}
          path: artifacts/test-logs/ci/explicit-save/
          if-no-files-found: warn

      - name: Verify native captured-draft execution
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("artifacts/test-logs/ci/native-save/native-save.trx").getroot()
          results = root.findall(".//t:UnitTestResult", ns)
          counters = root.find(".//t:Counters", ns)
          assert counters is not None
          assert len(results) == len({r.attrib["testId"] for r in results}) == 11
          assert all(r.attrib["outcome"] == "Passed" for r in results)
          assert all(counters.attrib[key] == "11" for key in ("total", "executed", "passed"))
          assert all(counters.attrib[key] == "0" for key in ("failed", "error", "timeout", "aborted"))
          assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"

      - name: Preserve native captured-draft results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-save-${{ matrix.rid }}
          path: artifacts/test-logs/ci/native-save/
          if-no-files-found: warn

      - name: GitHub credential parser isolation regression
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/test-logs/ci/gh-parser/trace
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~GhCliTokenSourceTests" --logger "trx;LogFileName=gh-parser.trx" --results-directory artifacts/test-logs/ci/gh-parser

      - name: GitHub native relationship proposal regression
        shell: python
        run: |
          import pathlib, subprocess, sys, xml.etree.ElementTree as ET
          base = pathlib.Path("artifacts/test-logs/ci/github-native")
          base.mkdir(parents=True, exist_ok=True)
          groups = [
              ("links", ["ProductionComposition_AuthorizesJournalsWritesAndReadsBackBothEndpoints"], 6),
              ("admission", ["ChangedPrecondition", "ExactRevisionDefault", "MissingOrWrongDigestAuthorization",
                             "ObservationToken", "JournalRejects"], 9),
              ("recovery", ["UncertainOrContradictoryResponse", "DeniedReadback", "CrashRecovery"], 7),
          ]
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for label, methods, expected in groups:
              selector = "|".join(f"FullyQualifiedName~GitHubNativeRelationshipTests.{m}" for m in methods)
              subprocess.run([sys.executable, "tools/run-bounded.py", "--timeout", "60", "--",
                              "dotnet", "vstest", "tests/Twig.Infrastructure.Tests/bin/Debug/net11.0/Twig.Infrastructure.Tests.dll",
                              f"/TestCaseFilter:{selector}", f"/Logger:trx;LogFileName={label}.trx",
                              f"/ResultsDirectory:{base}"], check=True)
              root = ET.parse(base / f"{label}.trx").getroot()
              results = root.findall(".//t:UnitTestResult", ns)
              assert len(results) == len({r.attrib["executionId"] for r in results}) == expected
              assert all(r.attrib["outcome"] == "Passed" for r in results)
              assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"

      - name: Preserve GitHub native relationship results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-github-native-${{ matrix.rid }}
          path: artifacts/test-logs/ci/github-native/
          if-no-files-found: warn

      - name: Rejected-create-family kernel regression
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Reconcile_RejectedCreateFamily_RequiresEveryMatchingSiblingToBeRejected|FullyQualifiedName~Reconcile_RejectedCreateFamily_AliasedWorktreePreservesExactAuthority|FullyQualifiedName~GetOpenIntents_StillExcludesExactReadbackAndSupersededSettlements|FullyQualifiedName~GetUnresolved_KeepsAProposalOpenForAnUnvalidatedRejectedFamilyReceipt" --logger "trx;LogFileName=rejected-create-family.trx" --results-directory artifacts/test-logs/ci/rejected-create-family

      - name: Verify rejected-create-family execution
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("artifacts/test-logs/ci/rejected-create-family/rejected-create-family.trx").getroot()
          results = root.findall(".//t:UnitTestResult", ns)
          counters = root.find(".//t:Counters", ns)
          assert counters is not None
          assert len(results) == len({r.attrib["executionId"] for r in results}) == 10
          assert len({r.attrib["testId"] for r in results}) == 10
          assert all(r.attrib["outcome"] == "Passed" for r in results)
          assert all(counters.attrib[key] == "10" for key in ("total", "executed", "passed"))
          assert all(counters.attrib[key] == "0" for key in ("failed", "error", "timeout", "aborted"))
          assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"

      - name: Preserve rejected-create-family results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-rejected-create-family-${{ matrix.rid }}
          path: artifacts/test-logs/ci/rejected-create-family/
          if-no-files-found: error

      - name: Windows GitHub parser retained concurrency regression
        if: matrix.rid == 'win-x64'
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~NativeReceiptRoundTripsSelectorDiscriminatorsAndRetainsExactCaptureFence|FullyQualifiedName~TwoStoreRace_RetirementVsAdmission_ExactlyOneWins|FullyQualifiedName~SchemaRebuild_DirtyFlagMissing_StillRefusesOnSeedRow|FullyQualifiedName~ProductionArguments_AreAcceptedByInstalledGhHelp_WithoutCredentialLookup" --logger "trx;LogFileName=gh-parser-overlap.trx" --results-directory artifacts/test-logs/ci/gh-parser-overlap

      - name: Preserve GitHub parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-gh-parser-${{ matrix.rid }}
          path: |
            artifacts/test-logs/ci/gh-parser/
            artifacts/test-logs/ci/gh-parser-overlap/
          if-no-files-found: warn

      # Includes the existing 109 actor/handler cases within 201 captured-read and consumer cases.
      - name: GitHub captured-read session and authenticated actor regression
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~GitHubCapturedReadSessionTests|FullyQualifiedName~GitHubAuthenticatedActorReaderTests|FullyQualifiedName~GitHubReadOnlyAuthHandlerTests|FullyQualifiedName~ProviderTargetBindingCompositionTests|FullyQualifiedName~GitHubWorkItemProviderTests" --logger "trx;LogFileName=github-actor.trx" --results-directory artifacts/test-logs/ci/github-actor

      - name: Verify GitHub captured-read and actor execution
        shell: python
        run: |
          import collections
          import xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse("artifacts/test-logs/ci/github-actor/github-actor.trx").getroot()
          results = root.findall(".//t:UnitTestResult", ns)
          definitions = root.findall(".//t:UnitTest", ns)
          counters = root.find(".//t:Counters", ns)
          assert counters is not None
          assert len(results) == len(definitions) == len({r.attrib["executionId"] for r in results}) == 201
          assert len({r.attrib["testId"] for r in results}) == 201
          assert {d.attrib["id"] for d in definitions} == {r.attrib["testId"] for r in results}
          groups = collections.Counter(d.find("t:TestMethod", ns).attrib["className"] for d in definitions)
          assert groups == {"Twig.Infrastructure.Tests.GitHub.GitHubCapturedReadSessionTests": 29, "Twig.Infrastructure.Tests.GitHub.GitHubAuthenticatedActorReaderTests": 39, "Twig.Infrastructure.Tests.GitHub.GitHubReadOnlyAuthHandlerTests": 70, "Twig.Infrastructure.Tests.GitHub.ProviderTargetBindingCompositionTests": 15, "Twig.Infrastructure.Tests.GitHub.GitHubWorkItemProviderTests": 48}
          assert all(r.attrib["outcome"] == "Passed" for r in results)
          assert all(counters.attrib[key] == "201" for key in ("total", "executed", "passed"))
          assert all(counters.attrib[key] == "0" for key in ("failed", "error", "timeout", "aborted", "notExecuted"))
          assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"

      - name: Preserve GitHub captured-read and authenticated actor results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-github-actor-${{ matrix.rid }}
          path: artifacts/test-logs/ci/github-actor/
          if-no-files-found: warn

      - name: Preservation v17 primary and publication regressions
        if: matrix.rid == 'win-x64'
        shell: python
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/test-logs/ci/preservation-v17/trace
        run: |
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          base = pathlib.Path("artifacts/test-logs/ci/preservation-v17")
          base.mkdir(parents=True, exist_ok=True)
          owned_temp = (base / "owned-temp").resolve()
          owned_temp.mkdir(exist_ok=True)
          os.environ.update({key: str(owned_temp) for key in ("TMP", "TEMP", "TMPDIR")})
          ordinary = ["ConflictingIntentCompletionPreservesPriorMapAndUnpublishedPayload",
                      "ExactRepeatKeepsFirstEvidenceAndContradictionsLeaveWholeStandingUnchanged",
                      "KnownMappingWithUnsettledIntentRefusesBeforeCreateOrIntentRewrite",
                      "StaleNegativeSaveCannotRecreateACompletedRetainedSeed"]
          groups = [("rich", "PreservationMigrationTests", ["SuccessfulMigrationPreservesSeedAndStandingThroughProductionReadersAfterReopen"], 1),
                    ("ordinary", "RetainedPublicationTests", ordinary, 4)]
          for label, method in [("map", "CrashAfterPublishMapKeepsKnownOutcomeAndStableIdentity"),
                                ("binding", "CrashAfterIdentityBindingKeepsKnownOutcomeAndStableIdentity"),
                                ("delete", "CrashAfterPayloadDeletionKeepsKnownOutcomeAndStableIdentity")]:
              groups.append((label, "RetainedPublicationTests", [method], 1))
          groups += [
              ("backup-owned-rows", "PreservationBackupProofTests", ["CoherentBackupOwnedRowsCannotBeCertifiedOrActivated", "RetainedManifestIsRevalidatedAgainstOwnedBackupRowsBeforeActivation"], 3),
              ("cancelled-history", "PreservationSchemaRebuildTests", ["CancelledSlotNullHistoryAllowsSchema15ScratchCloneRebuild"], 1),
              ("source-backup", "PreservationMigrationTests", ["SourceWriterAfterBackupPreventsActivationWithoutDiscardingItsChange", "BackupCopyCorruptionBlocksCertificationAndActivation"], 2),
              ("writers-generation", "PreservationMigrationTests", ["UnclassifiedTargetWriterIsRefusedWithoutClearingEitherView", "GenerationRaceAtActivationPreservesOriginalAdmissionAndPreparingIntent", "BackupFailureBlocksActivationAndCanResumeWithoutDeletingOriginals"], 3),
              ("cancel-local", "PreservationMigrationTests", ["FailedPreparationCanBeExplicitlyCancelledAndReviewedAgainAfterOrdinaryEdits", "LocalWritesRemainReversibleAndGenerationChangingTransitionIsBlockedBeforeIntent"], 2),
              ("reader-provenance", "PreservationMigrationTests", ["ActualReadersUseRetainedTablesAndRollbackRefusesDivergentOriginals", "ActualSeedReadersUseRetainedPayloadWithoutOriginalSeed"], 2),
              ("composition", "PreservationMigrationTests", ["SeedEditsAndLocalPublicationCompositionKeepIndependentStableLocalIdentity"], 1),
              ("interruption", "PreservationMigrationTests", ["InterruptedPreparationKeepsCurrentViewAndResumesOriginalIntent"], 4),
              ("corruption", "PreservationMigrationTests", ["PayloadRejectedByExistingReaderCannotActivateAndRemainsUnmodified"], 4),
              ("execution-admission", "PreservationMigrationTests", ["ExecutionAdmissionWriterIsFingerprintedBeforeActivationAndRetainedThroughRollback"], 2),
              ("guided-preservation", "WorkspaceMigrationCommandTests", ["ProductionCommandReportsMovementThenExplicitlyCutsOverAndRollsBack"], 1),
              ("guided-recovery", "WorkspaceMigrationCommandTests", ["InterruptedPreparationReportsIntentAndRequiresExactCancellationBeforeRereview"], 1),
              ("guided-refusals", "WorkspaceMigrationCommandTests", ["InvalidMutationArgumentsRefuseBeforeResolvingStorage", "ColdScopeRequiresOneDurableObservationRatherThanAnInMemoryWarmup", "UnadmittedStorageRefusesBeforeOpeningOrRebuildingOriginals", "ProviderTargetRefusesWithoutOpeningAdoStorageOrCallingTheProvider"], 6),
          ]
          for case in ["preparing-slot", "active-slot", "rolled-back-slot", "unknown-slot-null", "cancelled-slot", "cancelled-retained-target"]:
              groups.append((f"owning-history-{case}", "PreservationSchemaRebuildTests", ["OwningOrUnknownIntentAndRetainedTargetsRefuseSchemaRebuild"], 1))
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for label, cls, methods, count in groups:
              selector = "|".join(f"FullyQualifiedName=Twig.Cli.Tests.Commands.{cls}.{m}" for m in methods)
              if label.startswith("owning-history-"):
                  selector += "&DisplayName~" + label.removeprefix("owning-history-")
              args = [sys.executable, "tools/run-bounded.py", "--timeout", "60", "--", "dotnet", "test",
                      "tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj", "-f", "net11.0", "--no-build", "--no-restore",
                      "--filter", selector, "--logger", f"trx;LogFileName={label}.trx", "--results-directory", str(base)]
              with (base / f"{label}.log").open("w", encoding="utf-8") as log:
                  code = subprocess.call(args, stdout=log, stderr=subprocess.STDOUT)
              print((base / f"{label}.log").read_text(encoding="utf-8"), flush=True)
              if code:
                  raise SystemExit(code)
              root = ET.parse(base / f"{label}.trx").getroot()
              defs, results = root.findall(".//t:UnitTest", ns), root.findall(".//t:UnitTestResult", ns)
              counters = root.find(".//t:Counters", ns).attrib
              assert len(defs) == len(results) == len({r.attrib["testId"] for r in results}) == len({r.attrib["executionId"] for r in results}) == count
              assert {d.attrib["id"] for d in defs} == {r.attrib["testId"] for r in results}
              assert {d.find("t:TestMethod", ns).attrib["name"] for d in defs} == set(methods)
              assert all(d.find("t:TestMethod", ns).attrib["className"] == f"Twig.Cli.Tests.Commands.{cls}" for d in defs)
              assert root.find("t:ResultSummary", ns).attrib["outcome"] == "Completed"
              assert all(r.attrib["outcome"] == "Passed" for r in results)
              assert all(counters[k] == str(count) for k in ("total", "executed", "passed"))
              assert all(counters[k] == "0" for k in ("failed", "error", "timeout", "aborted", "notExecuted", "passedButRunAborted"))
      - name: Preserve preservation v17 regression results
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: twig-preservation-v17-${{ matrix.rid }}
          path: artifacts/test-logs/ci/preservation-v17/
          if-no-files-found: error

      - name: Fundamental build validation (15-second offline smoke)
        run: python tools/verify-build.py --binary src/Twig/bin/Debug/net11.0/twig.dll --timeout 15 --trace artifacts/smoke/boundaries.jsonl

      - name: Preserve smoke boundaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twig-smoke-${{ matrix.rid }}
          path: artifacts/smoke/
          if-no-files-found: warn

      # if:failure() so a captured stall is preserved. The trace is the ONLY artifact
      # that can name the stalling assembly and whether any test was in flight — vstest
      # prints a false-green summary and names nothing, and a TRX describes only tests
      # that COMPLETED.
      #
      # 🔴 The artifact name MUST carry the rid. upload-artifact@v4 rejects a second
      # upload under a name that already exists in the run, so a shared name would
      # make whichever leg finished second fail its upload — turning a captured stall
      # into a confusing upload error, on the exact run that finally caught the bug.
      - name: Upload #311 trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twig-311-trace-${{ matrix.rid }}
          path: |
            artifacts/trace-311/
            artifacts/test-logs/ci/
          if-no-files-found: warn

      # The external-host probe (AB#341). samples/Twig.DetailHost is the final
      # gate of wayfinder-detail-projection ticket 0006 §10 — it traces
      # consumer → public projection → host-owned renderer from OUTSIDE Twig,
      # and its location is load-bearing (a test project gets InternalsVisibleTo
      # and would pass while proving nothing).
      #
      # It carried an acceptance floor returning exit 1 on any miss, and nothing
      # ran it: the solution BUILDS the project, so a visibility regression was
      # caught, but the floor itself was dead weight. A mechanism that exists,
      # reads as protective, and is wired to nothing is the same defect class as
      # a green-looking aborted test run.
      #
      # DOTNET_ROLL_FORWARD is the explicit runtime decision, not an inherited
      # workaround. The sample targets net10.0 GA on purpose — that is the
      # property under test (a consumer is not dragged onto the preview SDK), so
      # retargeting it would delete what it proves. Installing a GA runtime here
      # would let it run natively but would stop exercising the case that ships:
      # a real consumer on a machine with only a newer runtime. Roll-forward IS
      # that consumer's experience, and it keeps CI identical to
      # tools/run-tests.sh --pre-push.
      #
      # `set -o pipefail` matters: without it the pipeline's status would be
      # grep's, and a probe that crashed before printing would read as a pass.
      #
      # AB#140: pinned to ONE leg rather than run per-platform. What this probe
      # asserts — that an external consumer reaches the public projection without
      # InternalsVisibleTo — is a property of the assembly boundary, not of the
      # host OS, so a second platform re-proves nothing. `shell: bash` would be
      # required on the Windows runner (the default there is pwsh), and paying
      # that for a duplicate answer trades real risk of a shell-portability
      # failure for no new information.
      - name: External host probe (samples/Twig.DetailHost)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          DOTNET_ROLL_FORWARD=Major \
            dotnet samples/Twig.DetailHost/bin/Debug/net10.0/Twig.DetailHost.dll \
            2>&1 | tee probe.log
          # Exit 0 alone is not enough: a probe gutted to `return 0` exits clean
          # and silent. Require the self-identifying success token too.
          grep -q 'PROBE OK:' probe.log \
            || { echo "::error::probe exited 0 without printing PROBE OK — a silent probe is not a pass"; exit 1; }
