name: Daemon package
on:
  push:
    tags: ['daemon-v*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daemon-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Standalone daemon package (no canvas or installation)
        shell: pwsh
        run: ./eng/daemon-package.ps1 -Output "$PWD\artifacts\daemon-win-x64" -PythonExecutable python
      - name: Include independent operator tooling
        shell: pwsh
        run: |
          Copy-Item eng\daemon-launch.ps1,eng\daemon-install.ps1,eng\daemon-run-owned.py artifacts\
          Compress-Archive -LiteralPath artifacts\daemon-win-x64,artifacts\daemon-launch.ps1,artifacts\daemon-install.ps1,artifacts\daemon-run-owned.py -DestinationPath artifacts\twig-daemon-win-x64.zip
          (Get-FileHash artifacts\twig-daemon-win-x64.zip).Hash | Set-Content artifacts\twig-daemon-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: twig-daemon-win-x64
          path: |
            artifacts/twig-daemon-win-x64.zip
            artifacts/twig-daemon-win-x64.zip.sha256
          if-no-files-found: error
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash eng/daemon-package-linux.sh
      - run: dotnet build src/Twig/Twig.csproj -m:1
      - run: python3 eng/run-bounded.py --timeout 60 -- bash eng/test-daemon-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: twig-daemon-linux-x64
          path: |
            artifacts/twig-daemon-linux-x64.tar.gz
            artifacts/twig-daemon-linux-x64.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/daemon-v')
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twig-daemon-*
          path: package
          merge-multiple: true
      - name: Publish independently versioned daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --latest=false --title "Twig daemon ${{ github.ref_name }}" --generate-notes package/*
