id = "twig-herdr-aot-candidate"
name = "Twig native browser candidate"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Opt-in native .NET browser; separate registration and state from twig-herdr. Requires source-scoped plugin pane open, pane get/list/process-info and JSON owner metadata. No automatic install, credential/store migration, default cutover or proposal publication. Signed platform artifact qualification remains a delivery gate."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
platforms = ["linux", "macos"]
title = "Open Twig bench (native candidate)"
command = ["./bin/twig", "bench", "browser", "--herdr", "--intent", "open"]

[[actions]]
id = "open-windows"
platforms = ["windows"]
title = "Open Twig bench (native candidate)"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw 'HERDR_PLUGIN_ROOT is unset'}; & (Join-Path $p 'scripts\launch.ps1') open''']

