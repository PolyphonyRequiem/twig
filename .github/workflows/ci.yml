name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore

      # GitHub issue #311 instrumentation.
      #
      # #311 was closed on the strength of the ADO #43 BuildFixture fix. That fix is
      # real and verified, but on 2026-08-14 the stall reproduced HERE, in CI, with
      # the Cli suite completing normally (3275 tests) and Twig.Tui.Tests stalling at
      # 9 of 85 — an assembly with no fixtures at all. So the fix addressed one
      # instance of the class, not the class.
      #
      # CI is the only environment with a demonstrated cheap repro rate (1 hit in 2
      # attempts, against ~1 in 11 under heavy local load and ~1 in 129 idle), so the
      # trace runs HERE rather than being hunted locally.
      #
      # TWIG_TEST_TRACE names a DIRECTORY; each assembly writes <assembly>.tsv into
      # it. Per-assembly files are mandatory, not cosmetic: this one invocation runs
      # six assemblies in PARALLEL processes, and an in-process lock cannot serialise
      # across process boundaries. Verified locally — 8234 boundaries, zero malformed
      # lines, zero interleaving.
      #
      # Cost when the variable is unset is one null check per boundary, so this does
      # not change what developers pay locally.
      - name: Test (with #311 boundary trace)
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/trace-311
        run: dotnet test --no-build --settings test.runsettings

      # if:failure() so a captured stall is preserved. The trace is the ONLY artifact
      # that can name the stalling assembly and whether any test was in flight — vstest
      # prints a false-green summary and names nothing, and a TRX describes only tests
      # that COMPLETED.
      - name: Upload #311 trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twig-311-trace
          path: artifacts/trace-311/
          if-no-files-found: warn

      # The external-host probe (AB#341). samples/Twig.DetailHost is the final
      # gate of wayfinder-detail-projection ticket 0006 §10 — it traces
      # consumer → public projection → host-owned renderer from OUTSIDE Twig,
      # and its location is load-bearing (a test project gets InternalsVisibleTo
      # and would pass while proving nothing).
      #
      # It carried an acceptance floor returning exit 1 on any miss, and nothing
      # ran it: the solution BUILDS the project, so a visibility regression was
      # caught, but the floor itself was dead weight. A mechanism that exists,
      # reads as protective, and is wired to nothing is the same defect class as
      # a green-looking aborted test run.
      #
      # DOTNET_ROLL_FORWARD is the explicit runtime decision, not an inherited
      # workaround. The sample targets net10.0 GA on purpose — that is the
      # property under test (a consumer is not dragged onto the preview SDK), so
      # retargeting it would delete what it proves. Installing a GA runtime here
      # would let it run natively but would stop exercising the case that ships:
      # a real consumer on a machine with only a newer runtime. Roll-forward IS
      # that consumer's experience, and it keeps CI identical to
      # tools/run-tests.sh --pre-push.
      #
      # `set -o pipefail` matters: without it the pipeline's status would be
      # grep's, and a probe that crashed before printing would read as a pass.
      - name: External host probe (samples/Twig.DetailHost)
        run: |
          set -euo pipefail
          DOTNET_ROLL_FORWARD=Major \
            dotnet samples/Twig.DetailHost/bin/Debug/net10.0/Twig.DetailHost.dll \
            2>&1 | tee probe.log
          # Exit 0 alone is not enough: a probe gutted to `return 0` exits clean
          # and silent. Require the self-identifying success token too.
          grep -q 'PROBE OK:' probe.log \
            || { echo "::error::probe exited 0 without printing PROBE OK — a silent probe is not a pass"; exit 1; }

