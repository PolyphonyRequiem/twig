name: CI
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Bounded-wrapper cleanup selftest (synthetic processes only)
        run: python eng/run-bounded.py --selftest
      - name: TRX selector coverage selftest (offline)
        run: python eng/verify-trx.py --selftest
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - name: Supported solution build (120-second deadline)
        run: python eng/run-bounded.py --timeout 120 -- dotnet build --no-restore "-m:1"

      - name: Native authority, lost acknowledgement recovery and independent canvas packages
        run: python eng/ci-checks.py native-authority
      - name: Daemon catalog identity, CAS and durable lost-response receipts (isolated)
        run: python eng/run-bounded.py --timeout 60 -- dotnet tests/Twig.Daemon.Catalog.Tests/bin/Debug/net11.0/Twig.Daemon.Catalog.Tests.dll
      - name: Provider-owned daemon sessions, native HTTP and admission guards (isolated)
        id: daemon_invariants
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Daemon.Tests/Twig.Daemon.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~SessionInvariantTests|FullyQualifiedName~NativeHttpInvariantTests|FullyQualifiedName~NativeSourceAdapterInvariantTests|FullyQualifiedName~NativeAccountLabelInvariantTests" --logger "trx;LogFileName=daemon-invariants.trx" --results-directory artifacts/test-logs/ci/daemon-invariants
      - name: Preserve provider-owned daemon invariant results
        if: always() && steps.daemon_invariants.outcome != 'skipped' && steps.daemon_invariants.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-daemon-invariants-${{ matrix.rid }}
          path: artifacts/test-logs/ci/daemon-invariants/*.trx
          if-no-files-found: error
      - name: Native presentation HTTP persistence without acquisition (isolated)
        id: native_presentation
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~NativePresentationHttpPersistsWithoutAcquisitionAndPreservesContentPriority" --logger "trx;LogFileName=presentation-http.trx" --results-directory artifacts/test-logs/ci/presentation-http
      - name: Preserve native presentation HTTP results
        if: always() && steps.native_presentation.outcome != 'skipped' && steps.native_presentation.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-presentation-${{ matrix.rid }}
          path: artifacts/test-logs/ci/presentation-http/*.trx
          if-no-files-found: error
      - name: Native Agent HTTP ten-scenario composition (isolated per case)
        id: native_agent_http
        run: python eng/ci-checks.py native-agent-http
      - name: Preserve native Agent HTTP results
        if: always() && steps.native_agent_http.outcome != 'skipped' && steps.native_agent_http.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-agent-http-${{ matrix.rid }}
          path: artifacts/test-logs/ci/agent-http/*.trx
          if-no-files-found: error
      - name: Native scalar editor HTTP and Panel boundary (isolated per case)
        id: native_scalar_http
        run: python eng/ci-checks.py native-scalar-http
      - name: Preserve native scalar HTTP results
        if: always() && steps.native_scalar_http.outcome != 'skipped' && steps.native_scalar_http.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-scalar-http-${{ matrix.rid }}
          path: artifacts/test-logs/ci/scalar-http/*.trx
          if-no-files-found: error
      - name: Native Plan HTTP composition (seven isolated cases)
        id: native_plan_http
        run: python eng/ci-checks.py native-plan-http
      - name: Preserve native Plan HTTP results
        if: always() && steps.native_plan_http.outcome != 'skipped' && steps.native_plan_http.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-plan-http-${{ matrix.rid }}
          path: artifacts/test-logs/ci/plan-http/*.trx
          if-no-files-found: error
      - name: Native normal-seed HTTP composition (seven isolated cases)
        id: native_seed_http
        run: python eng/ci-checks.py native-seed-http
      - name: Preserve native normal-seed HTTP results
        if: always() && steps.native_seed_http.outcome != 'skipped' && steps.native_seed_http.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-seed-http-${{ matrix.rid }}
          path: artifacts/test-logs/ci/seed-http/*.trx
          if-no-files-found: error
      - name: Native relationship HTTP composition (twenty-one isolated cases)
        id: native_relationship_http
        run: python eng/ci-checks.py native-relationship-http
      - name: Preserve native relationship HTTP results
        if: always() && steps.native_relationship_http.outcome != 'skipped' && steps.native_relationship_http.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-relationship-http-${{ matrix.rid }}
          path: artifacts/test-logs/ci/relationship-http/*.trx
          if-no-files-found: error
      - name: Native diagnostic and schema read composition (isolated)
        id: native_read_composition
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Daemon.Tests/Twig.Daemon.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName=Twig.Daemon.Tests.Native.NativeReadCompositionTests.RedactsDiagnosticsThroughNativeHostAndLoggingFilter|FullyQualifiedName=Twig.Daemon.Tests.Native.NativeReadCompositionTests.RetainsSchemaUntilExplicitNativeRecheck" --logger "trx;LogFileName=read-composition.trx" --results-directory artifacts/test-logs/ci/read-composition
      - name: Preserve native read-composition results
        if: always() && steps.native_read_composition.outcome != 'skipped' && steps.native_read_composition.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-read-composition-${{ matrix.rid }}
          path: artifacts/test-logs/ci/read-composition/*.trx
          if-no-files-found: error
      - name: Native initial-view HTTP acquisition boundary (isolated)
        id: native_initial_view
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~NativeInitialViewHttpRestoresWithOneLocalObservationAndNoProviderWork" --logger "trx;LogFileName=initial-view-http.trx" --results-directory artifacts/test-logs/ci/initial-view-http
      - name: Preserve native initial-view HTTP results
        if: always() && steps.native_initial_view.outcome != 'skipped' && steps.native_initial_view.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-initial-view-${{ matrix.rid }}
          path: artifacts/test-logs/ci/initial-view-http/*.trx
          if-no-files-found: error
      - name: Standalone daemon installer orchestration (synthetic only)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./eng/test-daemon-install.ps1
      - name: Install Linux daemon archive and exercise real headless lifecycle
        if: runner.os == 'Linux'
        run: |
          bash eng/daemon-package-linux.sh
          python3 eng/run-bounded.py --timeout 60 -- bash eng/test-daemon-linux.sh

      - name: Explicit native setup and creation-bound readback
        id: native_setup
        run: python eng/ci-checks.py native-setup
      - name: Preserve native setup results
        if: always() && steps.native_setup.outcome != 'skipped' && steps.native_setup.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-setup-${{ matrix.rid }}
          path: artifacts/test-logs/ci/native-setup/*.trx
          if-no-files-found: error

      - name: Compiled v10/v11 registry fresh-open and cached-handle compatibility (offline)
        run: python eng/ci-checks.py registry-compat
      - name: Clean-core invariant regression
        id: core
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Core.Tests/Twig.Core.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Core.Tests" --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-logs/ci/core
      - name: Preserve clean-core invariant results
        if: always() && steps.core.outcome != 'skipped' && steps.core.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-core-${{ matrix.rid }}
          path: artifacts/test-logs/ci/core/*.trx
          if-no-files-found: error

      - name: Clean-core real SQLite boundary regression
        id: store
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Store.Sqlite.Tests/Twig.Store.Sqlite.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Store.Sqlite.Tests" --logger "trx;LogFileName=store.trx" --results-directory artifacts/test-logs/ci/core-store
      - name: Preserve clean-core SQLite results
        if: always() && steps.store.outcome != 'skipped' && steps.store.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-core-store-${{ matrix.rid }}
          path: artifacts/test-logs/ci/core-store/*.trx
          if-no-files-found: error

      - name: Clean-core ADO adapter HTTP and real SQLite boundary regression
        id: ado
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Providers.Ado.Tests/Twig.Providers.Ado.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Providers.Ado.Tests" --logger "trx;LogFileName=ado.trx" --results-directory artifacts/test-logs/ci/core-ado
      - name: Preserve clean-core ADO adapter results
        if: always() && steps.ado.outcome != 'skipped' && steps.ado.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-core-ado-${{ matrix.rid }}
          path: artifacts/test-logs/ci/core-ado/*.trx
          if-no-files-found: error

      - name: Clean-core GitHub adapter HTTP and real SQLite boundary regression
        id: github
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Providers.GitHub.Tests/Twig.Providers.GitHub.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Providers.GitHub.Tests" --logger "trx;LogFileName=github.trx" --results-directory artifacts/test-logs/ci/core-github
      - name: Preserve clean-core GitHub adapter results
        if: always() && steps.github.outcome != 'skipped' && steps.github.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-core-github-${{ matrix.rid }}
          path: artifacts/test-logs/ci/core-github/*.trx
          if-no-files-found: error

      # Current production roots replace old ShowCommand/export envelopes,
      # captured Canvas/Browser/TUI/MCP gestures, legacy writers and migration.
      # Every method group gets its own unchanged 60-second owned-tree deadline
      # and selector-verified TRX. Never run either large root class as one filter.
      - name: Closed catalog, native host and fresh Core initialization
        id: catalog
        run: python eng/ci-checks.py catalog
      - name: Preserve closed catalog and bootstrap results
        if: always() && steps.catalog.outcome != 'skipped' && steps.catalog.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-catalog-${{ matrix.rid }}
          path: artifacts/test-logs/ci/catalog/*.trx
          if-no-files-found: error

      - name: Shared user-wide Bench store and metadata entrypoints
        id: user_benches
        run: python eng/ci-checks.py user-benches
      - name: Preserve shared user-wide Bench results
        if: always() && steps.user_benches.outcome != 'skipped' && steps.user_benches.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-user-benches-${{ matrix.rid }}
          path: artifacts/test-logs/ci/user-benches/*.trx
          if-no-files-found: error

      - name: Read-only native source host boundary
        id: native_source
        env:
          TWIG_TEST_TRACE: ${{ format('{0}{1}', github.workspace, runner.os == 'Windows' && '\artifacts\trace-311\native-source' || '/artifacts/trace-311/native-source') }}
        run: python eng/verify-trx.py -- dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~NativeSource|FullyQualifiedName~NativePanelSelection" --logger "trx;LogFileName=native-source.trx" --results-directory artifacts/test-logs/ci/native-source
      - name: Preserve native source host results
        if: always() && steps.native_source.outcome != 'skipped' && steps.native_source.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-source-${{ matrix.rid }}
          path: artifacts/test-logs/ci/native-source/*.trx
          if-no-files-found: error

      - name: Local layout and binding status diagnostics
        id: connection_status
        run: python eng/run-bounded.py --timeout 60 -- python eng/verify-trx.py -- dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~ConnectionStatusProductionCliTests" --logger "trx;LogFileName=connection-status.trx" --results-directory artifacts/test-logs/ci/connection-status
      - name: Preserve connection status results
        if: always() && steps.connection_status.outcome != 'skipped' && steps.connection_status.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-connection-status-${{ matrix.rid }}
          path: artifacts/test-logs/ci/connection-status/*.trx
          if-no-files-found: error

      - name: Retained ADO production CLI, draft, seed, link and Bench qualification
        id: ado_root
        run: python eng/ci-checks.py ado-root
      - name: Preserve retained ADO root results
        if: always() && steps.ado_root.outcome != 'skipped' && steps.ado_root.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-ado-root-${{ matrix.rid }}
          path: artifacts/test-logs/ci/ado-root/*.trx
          if-no-files-found: error

      - name: Retained GitHub production CLI, original UUID, local CAS and native authority qualification
        id: github_root
        run: python eng/ci-checks.py github-root
      - name: Preserve retained GitHub root results
        if: always() && steps.github_root.outcome != 'skipped' && steps.github_root.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-github-root-${{ matrix.rid }}
          path: artifacts/test-logs/ci/github-root/*.trx
          if-no-files-found: error

      - name: Native credential, canonical file/admission and declared-policy boundaries
        id: native_auth
        run: python eng/ci-checks.py native-auth
      - name: Preserve native authority results
        if: always() && steps.native_auth.outcome != 'skipped' && steps.native_auth.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-native-auth-${{ matrix.rid }}
          path: artifacts/test-logs/ci/native-auth/*.trx
          if-no-files-found: error

      - name: Supported Core-only platform delivery regression (offline)
        run: python eng/run-bounded.py --timeout 60 -- python eng/test-platform-support.py
      - name: Exercise the CLI and daemon command boundary
        run: python eng/run-bounded.py --timeout 60 -- python eng/test-daemon-commands.py

      - name: Fundamental build validation (60-second offline smoke)
        id: smoke
        run: python eng/verify-build.py --binary src/Twig/bin/Debug/net11.0/twig.dll --timeout 60 --trace artifacts/smoke/boundaries.jsonl
      - name: Preserve smoke boundaries
        if: always() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: twig-smoke-${{ matrix.rid }}
          path: artifacts/smoke/
          if-no-files-found: error

      - name: Preserve failed execution diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twig-failure-${{ matrix.rid }}
          path: |
            artifacts/trace-311/
            artifacts/test-logs/ci/
          if-no-files-found: warn

      # The supported public RenderTree boundary is not a retired UI launcher.
      # Keep the external net10 consumer and explicit roll-forward on Linux.
      - name: External host probe (samples/Twig.DetailHost)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          DOTNET_ROLL_FORWARD=Major \
            python eng/run-bounded.py --timeout 60 -- dotnet samples/Twig.DetailHost/bin/Debug/net10.0/Twig.DetailHost.dll \
            2>&1 | tee probe.log
          grep -q 'PROBE OK:' probe.log \
            || { echo "::error::probe exited 0 without printing PROBE OK"; exit 1; }
