name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.rid }})
    # AB#140 — CI used to be a single `runs-on: ubuntu-latest` job while the
    # release workflow publishes win-x64, linux-x64 and osx-arm64. Anything
    # platform-conditional was therefore untested until tag day, and the first
    # execution on Windows happened DURING a release.
    #
    # That is not hypothetical: v0.85.0 failed two of four platform legs. One was
    # ours — three tests hardcoded a Unix shell path and were merged with a green
    # CI check, because the only multi-platform run lived in the release workflow.
    #
    # The sibling half of that incident (NuGet publishing before the platform
    # builds had proven they could compile, burning a version string
    # irreversibly) was already fixed in #362: the `nuget` job now `needs: build`.
    # This is the other half — test the platforms we actually ship, on every PR.
    #
    # macOS was deliberately omitted at AB#140, with an explicit re-entry condition:
    # "Add osx-arm64 here if a macOS-specific defect ever escapes." One has. The
    # v0.92.0 release run's macOS ARM64 leg failed 38 CLI skill tests (AB#886) —
    # Path.GetTempPath() is /var/folders/... on macOS and /var is a symlink, which
    # the skill link guard correctly refuses. The defect was macOS-only, was invisible
    # to this workflow, and was therefore first executed DURING a release: precisely
    # the failure mode the comment above says this matrix exists to abolish.
    #
    # The cost/risk trade that justified omitting macOS was made when no macOS-specific
    # defect had escaped. That premise is now falsified, so the condition it named is met.
    strategy:
      # fail-fast: false so one platform's failure does not cancel the other's
      # run. The point of this matrix is learning about every platform from a
      # single push rather than discovering them one at a time across re-pushes
      # — the same reasoning the release workflow's build matrix already carries.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore

      - name: Fundamental build validation (15-second offline smoke)
        run: python tools/verify-build.py --binary src/Twig/bin/Debug/net11.0/twig.dll --timeout 15

      # if:failure() so a captured stall is preserved. The trace is the ONLY artifact
      # that can name the stalling assembly and whether any test was in flight — vstest
      # prints a false-green summary and names nothing, and a TRX describes only tests
      # that COMPLETED.
      #
      # 🔴 The artifact name MUST carry the rid. upload-artifact@v4 rejects a second
      # upload under a name that already exists in the run, so a shared name would
      # make whichever leg finished second fail its upload — turning a captured stall
      # into a confusing upload error, on the exact run that finally caught the bug.
      - name: Upload #311 trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twig-311-trace-${{ matrix.rid }}
          path: |
            artifacts/trace-311/
            artifacts/test-logs/ci/
          if-no-files-found: warn

      # The external-host probe (AB#341). samples/Twig.DetailHost is the final
      # gate of wayfinder-detail-projection ticket 0006 §10 — it traces
      # consumer → public projection → host-owned renderer from OUTSIDE Twig,
      # and its location is load-bearing (a test project gets InternalsVisibleTo
      # and would pass while proving nothing).
      #
      # It carried an acceptance floor returning exit 1 on any miss, and nothing
      # ran it: the solution BUILDS the project, so a visibility regression was
      # caught, but the floor itself was dead weight. A mechanism that exists,
      # reads as protective, and is wired to nothing is the same defect class as
      # a green-looking aborted test run.
      #
      # DOTNET_ROLL_FORWARD is the explicit runtime decision, not an inherited
      # workaround. The sample targets net10.0 GA on purpose — that is the
      # property under test (a consumer is not dragged onto the preview SDK), so
      # retargeting it would delete what it proves. Installing a GA runtime here
      # would let it run natively but would stop exercising the case that ships:
      # a real consumer on a machine with only a newer runtime. Roll-forward IS
      # that consumer's experience, and it keeps CI identical to
      # tools/run-tests.sh --pre-push.
      #
      # `set -o pipefail` matters: without it the pipeline's status would be
      # grep's, and a probe that crashed before printing would read as a pass.
      #
      # AB#140: pinned to ONE leg rather than run per-platform. What this probe
      # asserts — that an external consumer reaches the public projection without
      # InternalsVisibleTo — is a property of the assembly boundary, not of the
      # host OS, so a second platform re-proves nothing. `shell: bash` would be
      # required on the Windows runner (the default there is pwsh), and paying
      # that for a duplicate answer trades real risk of a shell-portability
      # failure for no new information.
      - name: External host probe (samples/Twig.DetailHost)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          DOTNET_ROLL_FORWARD=Major \
            dotnet samples/Twig.DetailHost/bin/Debug/net10.0/Twig.DetailHost.dll \
            2>&1 | tee probe.log
          # Exit 0 alone is not enough: a probe gutted to `return 0` exits clean
          # and silent. Require the self-identifying success token too.
          grep -q 'PROBE OK:' probe.log \
            || { echo "::error::probe exited 0 without printing PROBE OK — a silent probe is not a pass"; exit 1; }
