name: Native TUI candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gh-parser-diagnostic:
    name: Windows installed-gh parser diagnostic (non-candidate)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Record candidate gh file metadata (not child-image proof)
        shell: pwsh
        run: |
          $command = Get-Command gh -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $image = (Get-Item -LiteralPath $command.Source).FullName
          $file = Get-Item -LiteralPath $image
          $hash = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash
          [ordered]@{
            candidateResolutionPath = $image
            candidateResolutionSha256 = $hash
            fileVersion = $file.VersionInfo.FileVersion
            productVersion = $file.VersionInfo.ProductVersion
            proofScope = 'PATH candidate file metadata only; not the image observed in the test child.'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts-gh-resolution.json

      - name: Restore Infrastructure tests
        run: python tools/run-bounded.py --timeout 120 -- dotnet restore tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --nologo

      - name: Build Infrastructure test producer and consumer
        run: python tools/run-bounded.py --timeout 120 -- dotnet build tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-restore -f net11.0 '-m:1' --nologo

      - name: Parser fact alone, attempt 1
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/trace-311/fact-1
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName=Twig.Infrastructure.Tests.GitHub.GhCliTokenSourceTests.ProductionArguments_AreAcceptedByInstalledGhHelp_WithoutCredentialLookup" --logger "trx;LogFileName=fact-1.trx" --results-directory artifacts/test-logs/ci/gh-parser/fact-1 --nologo

      - name: Exact 28-case token-source class, attempt 1
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/trace-311/class-1
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Infrastructure.Tests.GitHub.GhCliTokenSourceTests" --logger "trx;LogFileName=class-1.trx" --results-directory artifacts/test-logs/ci/gh-parser/class-1 --nologo

      - name: Parser fact alone, attempt 2
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/trace-311/fact-2
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName=Twig.Infrastructure.Tests.GitHub.GhCliTokenSourceTests.ProductionArguments_AreAcceptedByInstalledGhHelp_WithoutCredentialLookup" --logger "trx;LogFileName=fact-2.trx" --results-directory artifacts/test-logs/ci/gh-parser/fact-2 --nologo

      - name: Exact 28-case token-source class, attempt 2
        env:
          TWIG_TEST_TRACE: ${{ github.workspace }}/artifacts/trace-311/class-2
        run: python tools/run-bounded.py --timeout 60 -- dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj --no-build --no-restore -f net11.0 --filter "FullyQualifiedName~Twig.Infrastructure.Tests.GitHub.GhCliTokenSourceTests" --logger "trx;LogFileName=class-2.trx" --results-directory artifacts/test-logs/ci/gh-parser/class-2 --nologo

      - name: Verify diagnostic test counts and per-attempt traces
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          cases = {
              "fact-1": (1, "fact-1.trx"),
              "class-1": (28, "class-1.trx"),
              "fact-2": (1, "fact-2.trx"),
              "class-2": (28, "class-2.trx"),
          }
          for name, (expected, trx_name) in cases.items():
              base = Path("artifacts/test-logs/ci/gh-parser") / name
              root = ET.parse(base / trx_name).getroot()
              results = root.findall(".//t:UnitTestResult", ns)
              counters = root.find(".//t:Counters", ns)
              summary = root.find("t:ResultSummary", ns)
              assert counters is not None and summary is not None
              assert len(results) == len({r.attrib["executionId"] for r in results}) == expected
              assert len({r.attrib["testId"] for r in results}) == expected
              assert all(r.attrib["outcome"] == "Passed" for r in results)
              assert all(counters.attrib[k] == str(expected) for k in ("total", "executed", "passed"))
              assert all(counters.attrib[k] == "0" for k in ("failed", "error", "timeout", "aborted"))
              assert summary.attrib["outcome"] == "Completed"
              trace = Path("artifacts/trace-311") / name / "Twig.Infrastructure.Tests.tsv"
              lines = [line.split("\t") for line in trace.read_text(encoding="utf-8").splitlines()]
              starts = Counter(line[2] for line in lines if len(line) >= 3 and line[1] == "START")
              ends = Counter(line[2] for line in lines if len(line) >= 3 and line[1] == "END")
              assert starts == ends and sum(starts.values()) == expected

      - name: Preserve Windows parser diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-parser-diagnostic-${{ github.sha }}
          path: |
            artifacts-gh-resolution.json
            artifacts/trace-311/
            artifacts/test-logs/ci/gh-parser/
          if-no-files-found: warn
